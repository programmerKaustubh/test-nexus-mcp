# Publish @twocan/testnexus-mcp to npm, with provenance.
#
# Runs only in the PUBLIC repo. Triggered by a v* tag. One tag push produces:
# the git tag, a verified npm release (with provenance), and a GitHub Release.
#
# Release steps: bump the version in package.json AND .claude-plugin/plugin.json,
# commit, then `git tag vX.Y.Z && git push <public> vX.Y.Z`.
name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # contents:write lets the job create the GitHub Release from the tag.
      contents: write
      # id-token:write is required for npm provenance (OIDC attestation).
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      # Install the exact locked tree; fails if package.json and the lockfile disagree.
      - run: npm ci

      # Gate: all version fields must agree with each other and with the tag, so a
      # release can never ship mismatched package/plugin/tag versions.
      - name: Verify versions are in sync
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./package.json').version")
          PLUGIN=$(node -p "require('./.claude-plugin/plugin.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG plugin.json=$PLUGIN tag=$TAG"
          if [ "$PKG" != "$PLUGIN" ]; then
            echo "::error::package.json ($PKG) and .claude-plugin/plugin.json ($PLUGIN) disagree"
            exit 1
          fi
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      # Guard: never publish a build pointing at the internal debug backend. The
      # public branches carry the prod URL; this fails loudly if a develop/debug
      # tree is ever about to be released (e.g. a mistaken manual publish).
      - name: Verify production endpoint (no debug URL)
        run: |
          if grep -q "api-debug" src/index.js; then
            echo "::error::src/index.js references the debug backend (api-debug) — refusing to publish."
            exit 1
          fi

      # Server must at least boot and expose its stdio transport before we publish.
      - name: Smoke test (server boots)
        run: timeout 10s node src/index.js < /dev/null || test $? -eq 124

      # Supply-chain gate: assert the tarball contains ONLY the expected files, so a
      # stray file (a note, a key, a fixture) can never be published by accident.
      - name: Verify tarball contents
        run: |
          FILES=$(npm pack --dry-run --json | node -e "
            const p = JSON.parse(require('fs').readFileSync(0));
            console.log(p[0].files.map(f => f.path).sort().join('\n'));
          ")
          echo "$FILES"
          EXPECTED=".claude-plugin/plugin.json
          LICENSE
          README.md
          hooks/claude-code-hook.json
          package.json
          src/index.js"
          if [ "$FILES" != "$EXPECTED" ]; then
            echo "::error::Tarball contents changed — review before publishing. Update this gate only after confirming every file belongs."
            diff <(echo "$EXPECTED") <(echo "$FILES") || true
            exit 1
          fi

      # provenance:true lives in package.json publishConfig, so plain publish attests.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Mirror the npm release as a GitHub Release so the tag, npm, and GitHub all
      # move together from the single tag push.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
