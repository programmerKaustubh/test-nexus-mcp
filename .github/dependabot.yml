# Dependabot keeps dependencies current. `@modelcontextprotocol/sdk` is pinned to
# an exact version in package.json so every upgrade is a deliberate, reviewed
# change rather than an automatic one — Dependabot opens a PR when a new version
# is available, keeping updates visible and intentional.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # Keep the release workflow's own actions up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
